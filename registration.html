
<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>رجسٹریشن فارم - Hafi Education</title>
  <style>
    body {
      font-family: 'Noto Naskh Arabic', serif;
      background-color: #f9f9f9;
      text-align: right;
      padding: 20px;
    }
    .form-container {
      background-color: white;
      padding: 20px;
      max-width: 400px;
      margin: auto;
      border: 1px solid #ccc;
      border-radius: 10px;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background-color: #28a745;
      color: white;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 5px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>رجسٹریشن فارم</h2>
    <form onsubmit="return submitForm()">
      <label>نام:</label>
      <input type="text" name="name" required>

      <label>ای میل:</label>
      <input type="email" name="email" required>

      <label>فون نمبر:</label>
      <input type="text" name="phone" required>

      <label>کورس کا انتخاب کریں:</label>
      <select name="course">
        <option>قرآن کلاس</option>
        <option>اردو گرامر</option>
        <option>ریاضی</option>
        <option>انگلش اسپیکنگ</option>
      </select>

      <button type="submit">درج کریں</button>
    </form>
  </div>

  <script>
    function submitForm() {
      alert("رجسٹریشن کامیاب ہو گئی ہے!");
      return false; // Stop real form submission
    }
  </script>
</body>
</html>
